<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#272727"/>
      <stop offset="50%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#272727"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <rect width="1280" height="360" fill="url(#grid)"/>
  </g>
  
  <!-- Left side: Logo + Title -->
  <g transform="translate(120, 180)">
    <!-- Owl logo -->
    <circle cx="60" cy="0" r="56" fill="#1a1a1a" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
    <path d="M30 -8 L22 -28 L44 -18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M90 -8 L98 -28 M76 -18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="32" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="45" cy="5" r="9" fill="#ffffff"/>
    <circle cx="75" cy="5" r="9" fill="#ffffff"/>
    <circle cx="47" cy="3" r="3" fill="#1a1a1a"/>
    <circle cx="77" cy="3" r="3" fill="#1a1a1a"/>
    <path d="M50 25 H70 L60 40 Z" fill="#ffffff"/>
    
    <!-- Title -->
    <text x="60" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.02em">OwlASO</text>
    <text x="60" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#737373" text-anchor="middle">Discover what users search for</text>
    <text x="60" y="170" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#737373" text-anchor="middle">and grow your app 10x faster</text>
  </g>
  
  <!-- Right side: Key metrics / badges -->
  <g transform="translate(720, 90)">
    <!-- Badge row 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="72" rx="14" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" font-variant-numeric="tabular-nums">20</text>
      <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3" text-anchor="middle">STOREFRONTS</text>
    </g>
    
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="220" height="72" rx="14" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" font-variant-numeric="tabular-nums">180</text>
      <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3" text-anchor="middle">DAYS HISTORY</text>
    </g>
    
    <!-- Badge row 2 -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="220" height="72" rx="14" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#34d399" text-anchor="middle" font-variant-numeric="tabular-nums">$0</text>
      <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3" text-anchor="middle">FOREVER FREE</text>
    </g>
    
    <g transform="translate(240, 92)">
      <rect x="0" y="0" width="220" height="72" rx="14" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#60a5fa" text-anchor="middle" font-variant-numeric="tabular-nums">MIT</text>
      <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3" text-anchor="middle">LICENSE</text>
    </g>
    
    <!-- Platform icons -->
    <g transform="translate(0, 190)">
      <text x="110" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#737373" text-anchor="middle">Runs on</text>
      <g transform="translate(20, 40)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>
      </g>
      <g transform="translate(64, 40)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </g>
      <g transform="translate(108, 40)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      </g>
      <g transform="translate(152, 40)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </g>
      <g transform="translate(196, 40)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5"><path d="M23 4.2l-2.9 3.3a10.5 10.5 0 0 1-1.5 7.4L4 20.7"/><path d="M12 12a4 4 0 0 0-3-3.7V5a2 2 0 0 1 4 0v3.3a4 4 0 0 1 3 3.7"/></svg>
      </g>
    </g>
  </g>
  
  <!-- Decorative line -->
  <line x1="120" y1="320" x2="1160" y2="320" stroke="#272727" stroke-width="1" opacity="0.5"/>
  
  <!-- Bottom tagline -->
  <text x="640" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#525252" text-anchor="middle">Free, open-source · Local-first · Private by design</text>
</svg>